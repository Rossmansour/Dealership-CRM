<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recon - DealerDomus</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="style.css" />
<script>
  if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
</script>
</head>
<body class="rc-body">

<header class="rc-top">
  <a class="rc-brand" href="/" title="Back to DealerDomus">
    <img src="logo.svg" alt="" width="40" height="23" />
    <span>DealerDomus</span>
  </a>
  <span class="rc-app-name">Recon</span>
  <nav class="rc-types" id="rcTypes" aria-label="Which cars">
    <button type="button" class="rc-type active" data-type="all">All</button>
    <button type="button" class="rc-type" data-type="new">New</button>
    <button type="button" class="rc-type" data-type="used">Used</button>
  </nav>
  <div class="rc-top-right">
    <input type="text" id="rcSearch" placeholder="Stock #, VIN, vehicle..." />
    <button type="button" class="btn-secondary btn-small" id="rcSetupBtn" hidden>⚙ Steps &amp; goals</button>
    <span class="rc-user" id="rcUser"></span>
  </div>
</header>

<nav class="rc-tabs" id="rcTabs" aria-label="Recon views">
  <button type="button" class="rc-tab active" data-rc-tab="cars">Cars in recon</button>
  <button type="button" class="rc-tab" data-rc-tab="approvals">Needs approval <span class="rc-count" id="rcApprovalCount">0</span></button>
  <button type="button" class="rc-tab" data-rc-tab="performance">Performance</button>
</nav>

<div class="rc-main">
  <div class="rc-strip" id="rcStrip"></div>
  <section class="rc-view rc-cars" data-rc-view="cars">
    <aside class="rc-steps" id="rcSteps" aria-label="Steps"></aside>
    <div class="rc-list" id="rcList"></div>
  </section>
  <section class="rc-view" data-rc-view="approvals" hidden><div id="rcApprovals"></div></section>
  <section class="rc-view" data-rc-view="performance" hidden><div id="rcPerformance"></div></section>
  <section class="rc-view" data-rc-view="car" hidden><div id="rcCar"></div></section>
</div>

<!-- Add work items from the store's list -->
<div class="modal" id="rcPickModal">
  <div class="modal-content rc-pick">
    <h2>Add work items</h2>
    <div class="rc-pick-body">
      <aside class="rc-pick-side">
        <label>Type to filter <input type="text" id="rcPickFilter" /></label>
        <div class="rc-pick-label">Sort</div>
        <label class="rc-inline"><input type="radio" name="rcPickSort" value="order" checked /> List order</label>
        <label class="rc-inline"><input type="radio" name="rcPickSort" value="alpha" /> A to Z</label>
        <div class="rc-pick-label">Phases</div>
        <div id="rcPickPhases"></div>
        <div class="rc-pick-label">Not on the list?</div>
        <input type="text" id="rcPickCustom" placeholder="Type a work item" />
        <select id="rcPickCustomPhase"></select>
      </aside>
      <div class="rc-pick-list" id="rcPickList"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="rcPickCancel">Cancel</button>
      <button type="button" class="btn-primary" id="rcPickAdd">Add</button>
    </div>
  </div>
</div>

<!-- Steps & goals -->
<div class="modal" id="rcSetupModal">
  <div class="modal-content">
    <h2>Recon steps &amp; goals</h2>
    <p class="send-text-hint">Cars move through these steps (in any order), then out to Frontline Ready or Wholesale. Each step's goal is in hours; the whole trip's goal is in days.</p>
    <label class="rc-goal-days">Goal: front line within <input type="number" id="rcGoalDays" min="1" step="0.5" /> days</label>
    <div id="rcStepRows"></div>
    <button type="button" class="btn-secondary btn-small" id="rcAddStep">+ Add step</button>
    <button type="button" class="btn-secondary btn-small" id="rcResetSteps">Reset to default steps</button>
    <p class="send-text-status-error" id="rcSetupMsg"></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="rcSetupCancel">Cancel</button>
      <button type="button" class="btn-primary" id="rcSetupSave">Save</button>
    </div>
  </div>
</div>

<script src="recon-ui.js"></script>
</body>
</html>
